<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Attendance Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            border: none;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .card-body { padding: 2rem; }
        .form-control {
            border-radius: 12px;
            border: 2px solid #e9ecef;
            padding: 12px 16px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102,126,234,0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }
        .back-link { color: #667eea; text-decoration: none; font-weight: 600; }
        .back-link:hover { color: #764ba2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-key fa-2x mb-2"></i>
                        <h4 class="fw-bold mb-1">Forgot Password</h4>
                        <p class="mb-0 opacity-75 small">We'll send an OTP to your registered email</p>
                    </div>
                    <div class="card-body">

                        <div th:if="${error}" class="alert alert-danger">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${error}"></span>
                        </div>
                        <div th:if="${success}" class="alert alert-success">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${success}"></span>
                        </div>

                        <!-- Step 1: Enter username or email -->
                        <div th:if="${showReset == null}">
                            <form id="step1Form" th:action="@{/forgot-password}" method="post" novalidate>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        <i class="fas fa-user me-2"></i>Username or Email
                                    </label>
                                    <input type="text" class="form-control" id="usernameOrEmail"
                                           name="usernameOrEmail" placeholder="Enter your username or email">
                                    <div class="invalid-feedback" id="usernameOrEmailError"></div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-paper-plane me-2"></i>Send OTP
                                </button>
                            </form>
                        </div>

                        <!-- Step 2: Enter OTP + new password (shown after OTP is sent) -->
                        <div th:if="${showReset == true}">
                            <form id="resetForm" th:action="@{/reset-password}" method="post" novalidate>
                                <input type="hidden" name="email" th:value="${email}">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        <i class="fas fa-shield-alt me-2"></i>OTP
                                    </label>
                                    <input type="text" class="form-control" id="otpInput" name="otp"
                                           placeholder="Enter 6-digit OTP" maxlength="6">
                                    <div class="invalid-feedback" id="otpError"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        <i class="fas fa-lock me-2"></i>New Password
                                    </label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="newPwd" name="newPassword"
                                               placeholder="Enter new password">
                                        <button class="btn btn-outline-secondary" type="button" id="toggleNewPwd">
                                            <i class="fas fa-eye" id="toggleNewPwdIcon"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback d-block" id="newPwdError"></div>
                                    <small class="text-muted">Must contain uppercase, lowercase, number, and special character</small>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">
                                        <i class="fas fa-lock me-2"></i>Confirm Password
                                    </label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="confirmPwd" name="confirmPassword"
                                               placeholder="Confirm new password">
                                        <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPwd">
                                            <i class="fas fa-eye" id="toggleConfirmPwdIcon"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback d-block" id="confirmPwdError"></div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-check-circle me-2"></i>Reset Password
                                </button>
                            </form>
                        </div>

                        <!-- After OTP sent but before reset form (showReset not set yet, success message shown) -->
                        <div th:if="${success != null and showReset == null}">
                            <hr>
                            <form id="resetForm2" th:action="@{/reset-password}" method="post" novalidate>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        <i class="fas fa-shield-alt me-2"></i>OTP
                                    </label>
                                    <input type="text" class="form-control" id="otpInput2" name="otp"
                                           placeholder="Enter 6-digit OTP" maxlength="6">
                                    <div class="invalid-feedback" id="otpError2"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        <i class="fas fa-lock me-2"></i>New Password
                                    </label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="newPwd2" name="newPassword"
                                               placeholder="Enter new password">
                                        <button class="btn btn-outline-secondary" type="button" id="toggleNewPwd2">
                                            <i class="fas fa-eye" id="toggleNewPwdIcon2"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback d-block" id="newPwdError2"></div>
                                    <small class="text-muted">Must contain uppercase, lowercase, number, and special character</small>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">
                                        <i class="fas fa-lock me-2"></i>Confirm Password
                                    </label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="confirmPwd2" name="confirmPassword"
                                               placeholder="Confirm new password">
                                        <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPwd2">
                                            <i class="fas fa-eye" id="toggleConfirmPwdIcon2"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback d-block" id="confirmPwdError2"></div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-check-circle me-2"></i>Reset Password
                                </button>
                            </form>
                        </div>

                        <div class="text-center mt-3">
                            <a href="/login" class="back-link">
                                <i class="fas fa-arrow-left me-1"></i>Back to Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function validatePassword(pwd) {
        return /[A-Z]/.test(pwd) && /[a-z]/.test(pwd) &&
               /[0-9]/.test(pwd) && /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pwd);
      }

      function setupToggle(btnId, iconId, inputId) {
        const btn = document.getElementById(btnId);
        const icon = document.getElementById(iconId);
        const input = document.getElementById(inputId);
        if (!btn || !input) return;
        btn.addEventListener('click', function () {
          const isPassword = input.getAttribute('type') === 'password';
          input.setAttribute('type', isPassword ? 'text' : 'password');
          icon.classList.toggle('fa-eye');
          icon.classList.toggle('fa-eye-slash');
        });
      }

      function setupResetFormValidation(formId, otpId, otpErrId, pwdId, pwdErrId, confirmId, confirmErrId) {
        const form = document.getElementById(formId);
        if (!form) return;

        const otpInput     = document.getElementById(otpId);
        const pwdInput     = document.getElementById(pwdId);
        const confirmInput = document.getElementById(confirmId);
        const otpErr       = document.getElementById(otpErrId);
        const pwdErr       = document.getElementById(pwdErrId);
        const confirmErr   = document.getElementById(confirmErrId);

        otpInput.addEventListener('input', function () {
          if (!/^\d{6}$/.test(this.value.trim())) {
            this.classList.add('is-invalid');
            otpErr.textContent = 'OTP must be exactly 6 digits.';
          } else {
            this.classList.remove('is-invalid');
            otpErr.textContent = '';
          }
        });

        pwdInput.addEventListener('input', function () {
          if (!validatePassword(this.value)) {
            this.classList.add('is-invalid');
            pwdErr.textContent = 'Password must contain uppercase, lowercase, number, and special character.';
          } else {
            this.classList.remove('is-invalid');
            pwdErr.textContent = '';
          }
          // re-check confirm match
          if (confirmInput.value) {
            if (confirmInput.value !== this.value) {
              confirmInput.classList.add('is-invalid');
              confirmErr.textContent = 'Passwords do not match.';
            } else {
              confirmInput.classList.remove('is-invalid');
              confirmErr.textContent = '';
            }
          }
        });

        confirmInput.addEventListener('input', function () {
          if (this.value !== pwdInput.value) {
            this.classList.add('is-invalid');
            confirmErr.textContent = 'Passwords do not match.';
          } else {
            this.classList.remove('is-invalid');
            confirmErr.textContent = '';
          }
        });

        form.addEventListener('submit', function (e) {
          let valid = true;

          if (!/^\d{6}$/.test(otpInput.value.trim())) {
            e.preventDefault(); valid = false;
            otpInput.classList.add('is-invalid');
            otpErr.textContent = 'OTP must be exactly 6 digits.';
          }
          if (!validatePassword(pwdInput.value)) {
            e.preventDefault(); valid = false;
            pwdInput.classList.add('is-invalid');
            pwdErr.textContent = 'Password must contain uppercase, lowercase, number, and special character.';
          }
          if (confirmInput.value !== pwdInput.value) {
            e.preventDefault(); valid = false;
            confirmInput.classList.add('is-invalid');
            confirmErr.textContent = 'Passwords do not match.';
          }
        });
      }

      document.addEventListener('DOMContentLoaded', function () {
        // Step 1 form validation
        const step1Form = document.getElementById('step1Form');
        if (step1Form) {
          const input = document.getElementById('usernameOrEmail');
          const err   = document.getElementById('usernameOrEmailError');
          input.addEventListener('input', function () {
            if (!this.value.trim()) {
              this.classList.add('is-invalid');
              err.textContent = 'Please enter your username or email.';
            } else {
              this.classList.remove('is-invalid');
              err.textContent = '';
            }
          });
          step1Form.addEventListener('submit', function (e) {
            if (!input.value.trim()) {
              e.preventDefault();
              input.classList.add('is-invalid');
              err.textContent = 'Please enter your username or email.';
            }
          });
        }

        // Reset form (showReset == true)
        setupToggle('toggleNewPwd',     'toggleNewPwdIcon',     'newPwd');
        setupToggle('toggleConfirmPwd', 'toggleConfirmPwdIcon', 'confirmPwd');
        setupResetFormValidation('resetForm', 'otpInput', 'otpError', 'newPwd', 'newPwdError', 'confirmPwd', 'confirmPwdError');

        // Reset form (success message shown, step 2)
        setupToggle('toggleNewPwd2',     'toggleNewPwdIcon2',     'newPwd2');
        setupToggle('toggleConfirmPwd2', 'toggleConfirmPwdIcon2', 'confirmPwd2');
        setupResetFormValidation('resetForm2', 'otpInput2', 'otpError2', 'newPwd2', 'newPwdError2', 'confirmPwd2', 'confirmPwdError2');
      });
    </script>
</body>
</html>
